[project]
name = "courier"
version = "0.1.0"
description = "Почтальон Junior_IT: Telegram-бот с файловыми очередями, о курсе не знает"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.13,<4", "aiohttp-socks>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
courier = "courier.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["courier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
