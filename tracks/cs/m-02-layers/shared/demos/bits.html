<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Биты-лампочки и собери цвет · cs-02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a14; --card: #1a1a2e; --card-2: #16213e; --deep: #0f3460;
    --yellow: #ffd60a; --orange: #ff5722; --green: #00e676; --cyan: #00ffc8; --magenta: #ff0096;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: #eef; font-family: 'Manrope', sans-serif;
    margin: 0; padding: 32px 16px; min-height: 100vh; display: flex;
    flex-direction: column; align-items: center;
  }
  .label { color: var(--cyan); letter-spacing: 4px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  h1 { font-size: clamp(24px, 5vw, 34px); margin: 6px 0 4px; text-align: center; }
  .sub { color: #9aa; font-size: 15px; margin: 0 0 26px; text-align: center; max-width: 560px; }

  .box { width: 100%; max-width: 640px; }

  .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
  .tab {
    flex: 1; padding: 14px; border: 1px solid #2a2a44; border-radius: 12px;
    background: var(--card); color: #cdd; font-family: 'Manrope', sans-serif;
    font-weight: 700; font-size: 16px; cursor: pointer; transition: background .18s, color .18s, border-color .18s;
  }
  .tab:hover { border-color: var(--deep); }
  .tab.active { background: var(--yellow); color: var(--bg); border-color: var(--yellow); }

  .panel { display: none; }
  .panel.active { display: block; animation: pop .3s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  /* Лампочки */
  .lamps {
    background: var(--card); border: 1px solid #2a2a44; border-radius: 18px;
    padding: 28px 16px; display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 10px; margin-bottom: 22px;
  }
  .bit { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .lamp {
    width: 100%; max-width: 66px; aspect-ratio: 1; border-radius: 50%; cursor: pointer; padding: 0;
    background: var(--card-2); border: 3px solid var(--deep);
    transition: background .15s, box-shadow .2s, transform .1s;
  }
  .lamp:hover { transform: scale(1.06); }
  .lamp:active { transform: scale(0.94); }
  .lamp.on {
    border-color: transparent;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.45), rgba(255,255,255,0) 55%), var(--yellow);
    box-shadow: 0 0 0 4px rgba(255,214,10,0.18), 0 0 30px rgba(255,214,10,0.6);
  }
  .bit .digit { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(14px, 3.5vw, 20px); color: #9aa3c0; }
  .bit .digit.on { color: var(--yellow); }

  .readout { background: var(--card-2); border-radius: 16px; padding: 8px 4px; }
  .stat { display: flex; align-items: baseline; gap: 16px; padding: 16px 22px; border-bottom: 1px solid #23233c; }
  .stat:last-child { border-bottom: none; }
  .stat .k { color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 1px; width: 128px; flex: none; }
  .stat .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--yellow); }
  .stat .v.bin { font-size: clamp(20px, 5vw, 30px); letter-spacing: 4px; }
  .stat .v.dec, .stat .v.hex { font-size: clamp(26px, 7vw, 40px); }

  /* Собери цвет */
  .swatch-big {
    height: 150px; border-radius: 16px; border: 1px solid #2a2a44;
    background: #000000; margin-bottom: 16px; transition: background .1s;
  }
  .hexline {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: clamp(30px, 9vw, 48px); color: #eef; margin-bottom: 22px; letter-spacing: 2px;
  }
  .sliders {
    background: var(--card); border: 1px solid #2a2a44; border-radius: 18px;
    padding: 22px 20px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 22px;
  }
  .channel { display: flex; align-items: center; gap: 16px; }
  .channel .name { width: 82px; flex: none; font-weight: 600; font-size: 15px; }
  .channel input[type=range] { flex: 1; height: 30px; cursor: pointer; }
  .channel .pair {
    width: 44px; flex: none; text-align: center; font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 20px; color: #cdd;
  }
  .ch-r input { accent-color: var(--orange); }  .ch-r .name { color: var(--orange); }
  .ch-g input { accent-color: var(--green); }   .ch-g .name { color: var(--green); }
  .ch-b input { accent-color: var(--cyan); }    .ch-b .name { color: var(--cyan); }

  .presets { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .preset {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer;
    background: var(--card-2); border: 1px solid #2a2a44; border-radius: 12px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: #eef;
    transition: transform .1s, border-color .18s;
  }
  .preset:hover { transform: translateY(-2px); border-color: var(--deep); }
  .preset .dot { width: 22px; height: 22px; border-radius: 6px; flex: none; }

  @media (max-width: 480px) {
    .lamps { padding: 20px 10px; gap: 6px; }
    .lamp { border-width: 2px; }
  }
</style></head>
<body>
  <div class="label">// cs-02 · биты и цвет</div>
  <h1>Лампочки, из которых собран цвет</h1>
  <p class="sub">Зажигай биты и смотри на число. Потом собери из красного, зелёного и синего свой цвет.</p>

  <div class="box">
    <div class="tabs">
      <button class="tab active" data-tab="bits">Лампочки</button>
      <button class="tab" data-tab="color">Собери цвет</button>
    </div>

    <section class="panel active" id="panel-bits">
      <div class="lamps" id="lamps"></div>
      <div class="readout">
        <div class="stat"><span class="k">двоичное</span><span class="v bin" id="bin">00000000</span></div>
        <div class="stat"><span class="k">десятичное</span><span class="v dec" id="dec">0</span></div>
        <div class="stat"><span class="k">16-ричное</span><span class="v hex" id="hex">00</span></div>
      </div>
    </section>

    <section class="panel" id="panel-color">
      <div class="swatch-big" id="swatch"></div>
      <div class="hexline" id="hexLabel">#000000</div>
      <div class="sliders">
        <div class="channel ch-r"><label class="name" for="r">красный</label><input type="range" id="r" min="0" max="255" value="0"><span class="pair" id="pair-r">00</span></div>
        <div class="channel ch-g"><label class="name" for="g">зелёный</label><input type="range" id="g" min="0" max="255" value="0"><span class="pair" id="pair-g">00</span></div>
        <div class="channel ch-b"><label class="name" for="b">синий</label><input type="range" id="b" min="0" max="255" value="0"><span class="pair" id="pair-b">00</span></div>
      </div>
      <div class="presets" id="presets"></div>
    </section>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const panels = { bits: document.getElementById('panel-bits'), color: document.getElementById('panel-color') };
    tabs.forEach(tab => tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      Object.keys(panels).forEach(name => panels[name].classList.toggle('active', name === tab.dataset.tab));
    }));

    const bits = [0, 0, 0, 0, 0, 0, 0, 0];
    const lampsBox = document.getElementById('lamps');
    const lampEls = [];
    const digitEls = [];
    bits.forEach((_, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'bit';
      const lamp = document.createElement('button');
      lamp.className = 'lamp';
      lamp.setAttribute('aria-label', 'бит ' + (i + 1));
      lamp.setAttribute('aria-pressed', 'false');
      lamp.addEventListener('click', () => toggle(i));
      const digit = document.createElement('div');
      digit.className = 'digit';
      digit.textContent = '0';
      wrap.appendChild(lamp);
      wrap.appendChild(digit);
      lampsBox.appendChild(wrap);
      lampEls.push(lamp);
      digitEls.push(digit);
    });

    const binEl = document.getElementById('bin');
    const decEl = document.getElementById('dec');
    const hexEl = document.getElementById('hex');

    function toggle(i) { bits[i] = 1 - bits[i]; render(); }
    function render() {
      const val = bits.reduce((acc, b) => acc * 2 + b, 0);
      bits.forEach((b, i) => {
        lampEls[i].classList.toggle('on', b === 1);
        lampEls[i].setAttribute('aria-pressed', b === 1 ? 'true' : 'false');
        digitEls[i].textContent = b;
        digitEls[i].classList.toggle('on', b === 1);
      });
      binEl.textContent = bits.join('');
      decEl.textContent = val;
      hexEl.textContent = val.toString(16).toUpperCase().padStart(2, '0');
    }
    render();

    const r = document.getElementById('r');
    const g = document.getElementById('g');
    const b = document.getElementById('b');
    const swatch = document.getElementById('swatch');
    const hexLabel = document.getElementById('hexLabel');
    const pairR = document.getElementById('pair-r');
    const pairG = document.getElementById('pair-g');
    const pairB = document.getElementById('pair-b');

    function toHexPair(v) { return v.toString(16).padStart(2, '0'); }
    function renderColor() {
      pairR.textContent = toHexPair(+r.value);
      pairG.textContent = toHexPair(+g.value);
      pairB.textContent = toHexPair(+b.value);
      const hex = '#' + [r.value, g.value, b.value].map(v => toHexPair(+v)).join('');
      swatch.style.background = hex;
      hexLabel.textContent = hex;
    }
    [r, g, b].forEach(slider => slider.addEventListener('input', renderColor));

    const presetsBox = document.getElementById('presets');
    ['#ffd60a', '#00ffc8', '#ff0096', '#ff5722'].forEach(hex => {
      const btn = document.createElement('button');
      btn.className = 'preset';
      btn.innerHTML = '<span class="dot" style="background:' + hex + '"></span>' + hex;
      btn.addEventListener('click', () => {
        r.value = parseInt(hex.slice(1, 3), 16);
        g.value = parseInt(hex.slice(3, 5), 16);
        b.value = parseInt(hex.slice(5, 7), 16);
        renderColor();
      });
      presetsBox.appendChild(btn);
    });
    renderColor();
  </script>
</body></html>
