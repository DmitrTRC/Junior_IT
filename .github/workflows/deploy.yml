name: Deploy to GitHub Pages

# Собирает публикуемую часть репозитория и деплоит на каждый push в main.
# teacher/, инструменты и рабочие материалы на сайт не попадают.
# Адрес: https://dmitrtrc.github.io/Junior_IT/

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate quiz bank
        run: python3 tools/validate_quizzes.py .
      - name: Trainer engine tests
        run: node --test tools/trainer-tests/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python for course map
        run: pip install pyyaml
      - name: Build site
        run: PYBIN=python3 ./tools/build_site.sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
