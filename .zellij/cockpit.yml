version: 1
cards:
  - id: web
    type: process
    label: "http.server:8000"
    start: "python3 -m http.server 8000"
    ready: "curl -sf --max-time 3 localhost:8000 >/dev/null"
    autostart: false

  - id: zoom
    type: schedule
    label: "zoom-pipeline"
    launchd: "com.juniorit.zoom-pipeline"

  - id: pages
    type: remote
    label: "gh-pages"
    status: "gh run list --workflow deploy.yml -L1 --json status,conclusion,createdAt"
    open: "https://github.com/DmitrTRC/Junior_IT/actions"
    interval: 120

  - id: validate
    type: task
    label: "validate modules"
    run: "cd tools && .venv/bin/python validate_modules.py .."

  - id: students
    type: status
    label: "ученики"
    status: "tools/.venv/bin/python tools/group_status.py"
    interval: 300

  - id: students-backup
    type: schedule
    label: "students → NAS"
    launchd: "com.juniorit.students-backup"
