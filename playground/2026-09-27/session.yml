# Второй заход на python-01 для всей группы. Факт к 27.09: Маша и Матвей
# Python не трогали (20.09 эфир съели повтор теории и техчек), Неля прошла
# модуль один на один 24.09 — ей роль эксперта, но --version, 10 / 3, 10 // 3
# и hello.py с тремя print у неё тоже впервые.
# Уроки разбора 20.09: техчек закрывается ДО эфира скриншотами, любой
# повтор теории — не дольше 2 минут, never_cut-блок стоит первым, домашка
# проговаривается голосом.
date: 2026-09-27
time: "20:00"
duration: 75
theme: "Первый Python — руками каждого, второй заход"
playlist:
  - {module: python/m-01-first-run, minutes: 40}
buffer: 15
# Остальное: старт 2 мин + тренажёр главы 1 (Тренировка) 15 мин + финал 3 мин.
homework:
  due: 2026-09-30
  items:
    - homework/python-01-first-run

# До эфира (сегодня днём):
# - в MAX: до 19:00 скриншот `python3 --version` (Маша — `python --version`
#   в Git Bash из Windows Terminal). У кого не вышло — разбираем до звонка.
# - Матвей: на 20.09 у одного мака не было Command Line Tools — если это он,
#   provisioning/setup-mac.sh до занятия, не в эфире.
# - Неля: сработала ли встреча 25.09 (setup-mac.sh, Python 3.13 вместо 3.9.6)?
#   Если нет — идёт на 3.9.6, см. «Если живой код встал» в live-code.md.
# - Платформы: по записи 20.09 двое из троих были на Windows, по ростеру —
#   одна Маша. Уточнить у Матвея, на чём сидит сегодня.
# - Маша на Git Bash: python3 (alias), touch, nano — как на маке; таблица
#   PowerShell в live-code.md ей не нужна.

# Ротация шаринга: трое, 75 минут. Шарит один, набирают все трое у себя;
# двое без шаринга называют результат вслух («что у тебя после 10 // 3?»).
# Неля — эксперт: отвечает первой на «где я — >>> или %?» и «что читаем в
# traceback первым?».
rotation:
  - {at: "0:00", who: все, what: "старт без повтора: терминал открыт, cd ~/code/junior_it, pwd — по 30 сек, Маша первая; кто не открыл — наблюдатель"}
  - {at: "0:02", who: Димас, what: "S1–S2 «Почему Python» — 3 мин, свой шаринг; в конце 30 сек: где на клавиатуре кавычка, дефис, тильда (20.09 и 24.09 — главный тормоз)"}
  - {at: "0:05", who: Маша, what: "шаги 1–3: python3 --version, python3, 2 + 2, 10 / 3, 10 // 3, print, exit() — 4 мин"}
  - {at: "0:09", who: Матвей, what: "шаги 1–3 — 3 мин"}
  - {at: "0:12", who: Неля, what: "показать починенный demo.py (домашка 24.09), --version (24.09 не вышло), 10 / 3, 10 // 3; вслух: «>>> — это где я?» — 3 мин"}
  - {at: "0:15", who: Димас, what: "S4 «в >>> разговариваешь, в файле пишешь письмо» — закрыть вопрос Нели «зачем каждый раз python3» — 2 мин"}
  - {at: "0:17", who: Матвей, what: "шаг 4: touch, nano, три print о себе, python3 hello.py — 6 мин; остальные набирают свой hello.py параллельно"}
  - {at: "0:23", who: Маша, what: "python3 hello.py на своём шаринге (nano в Git Bash) — 3 мин"}
  - {at: "0:26", who: Неля, what: "hello.py с тремя print (у неё с 24.09 только demo.py с суммой), запуск — 2 мин"}
  - {at: "0:28", who: Маша, what: "шаг 5: стереть кавычку, запуск, читаем снизу вверх — 4 мин"}
  - {at: "0:32", who: Матвей, what: "то же — 3 мин"}
  - {at: "0:35", who: Неля, what: "эксперт: на traceback Матвея называет, что читать первым; Димас S5 — 3 мин"}
  - {at: "0:38", who: Димас, what: "S6 «Что дальше» + домашка ГОЛОСОМ: hello.py + broken.py до среды 30.09, скриншотами в MAX — 3 мин"}
  - {at: "0:41", who: Димас, what: "тренажёр главы 1, режим Тренировка: по вопросу каждому вслух по кругу; в среду 30.09 — режим Зачёт — 15 мин"}
  - {at: "0:56", who: Димас, what: "анонс среды (зачёт), вопросы — 4 мин"}
  - {at: "1:00", who: —, what: "буфер 15 мин"}

cutting_plan:
  no_live_tech_fix:
    trigger: "у кого-то не открылся терминал или python3 в первые 2 минуты"
    cut: "работает наблюдателем: набирает на слух, называет ответы; разбор после эфира"
    note: "техника в эфире не чинится — урок 16.09 и 20.09, второй раз подряд"
  recap_timebox:
    trigger: "любое вступление или повтор теории идёт 3-ю минуту"
    cut: "одна фраза-мостик и руки на клавиатуру"
    note: "20.09 повтор «Информация и данные» съел 15 минут — триггера не было"
  teacher_typing:
    trigger: "Димас набирает команды на своём экране дольше минуты"
    cut: "передать ввод ребёнку, чей сейчас шаринг; свой экран — только слайды"
  midpoint_check:
    trigger: "к 0:20 шаг 4 (hello.py) не начат"
    cut: "шаг 4 только на шаринге Матвея, остальные параллельно; traceback — по одному разу у Маши и Матвея"
  if_behind_10min:
    trigger: "отставание 10 минут внутри python-01"
    cut:
      - "«Почему Python» — до одной минуты"
      - "«Что дальше» — текстом в MAX со шпаргалкой, домашка всё равно голосом"
      - "тренажёр — 8 минут вместо 15"
  never_cut:
    - "первый print каждого из троих в >>> — на своём шаринге"
    - "шаг 5 у Маши и Матвея руками — кульминация модуля"
    - "домашка голосом до прощания, минимум 30 секунд"
  last_resort: "жертвуй тренажёром целиком (Тренировку — домашкой на среду), не traceback и не первым print"
