date: 2026-10-14
time: "20:00"
duration: 75
theme: "Свой диалог, две версии в Git и число из строки"
playlist:
  - {module: python/m-02-variables, minutes: 12}
  - {module: devops/m-02-git-first-commit, minutes: 25}
  - {module: book/m-02-information-processes, minutes: 10}
  - {module: book/m-03-representation, minutes: 10}
buffer: 18
# 57 минут модулей + 3 пауза + 10 расширение/закрепление + 5 финал = 75.
completed: []
homework:
  due: 2026-10-18
  items:
    - homework/devops-03-dialogue-history
basis:
  review: playground/2026-10-14/teacher-notes.md
  confirmed: "11.10 показаны input, int и float; Git явно перенесён на следующую встречу (30:02–30:25 VTT)."
  unknown: "Самостоятельные файлы и запуски по VTT 11.10 не подтверждены; учебник в записи не зафиксирован. Нужен показ каждого."
  textbook_scope: "Закрепление §1.2 и §1.3.1–1.3.4; §1.3.5 не объявляем пройденным."
goals:
  - "Каждый запускает свой dialogue.py с двумя разными наборами ответов."
  - "Каждый при рабочем Git делает две локальные версии и находит их в git log."
  - "Каждый отличает сохранение файла, commit и сохранение через сайт GitHub."
  - "Каждый на новом примере различает информационные процессы, форму и восприятие."
  - "После личного минимума input: преобразовать текст цифр через int и выполнить сложение."
preparation:
  - "Локальный пульт: index.html; сценарий: teacher-notes.md."
  - "До звонка открыть материалы и узнать git --version; установки и доступы решать отдельно."
  - "Для Git приготовить отдельную git-lab вне существующих репозиториев."
  - "Не считать прошлую домашку сданной без просмотра; её доставка и доступ не подтверждены."
rotation:
  - {at: "0:00", who: "первый → второй → третий", what: "12 мин: свой dialogue.py, два запуска. Все пишут параллельно; экран меняется каждые 3–4 мин. Если файла нет — один input и print, затем второй вопрос."}
  - {at: "0:12", who: все, what: "25 мин: Git до расширений Python. Отдельная папка, первый коммит, изменение приветствия, второй коммит. GitHub только при готовом доступе."}
  - {at: "0:37", who: все, what: "3 мин: встать, отвести взгляд от экрана."}
  - {at: "0:40", who: все, what: "10 мин: четыре процесса и источник/канал/приёмник на новых примерах."}
  - {at: "0:50", who: все, what: "10 мин: общий код и различие формы представления и восприятия. §1.3.5 отдельно позже."}
  - {at: "1:00", who: все, what: "10 мин: score.py, input → int → прибавить 5; если input не получается — закрепить текстовый диалог."}
  - {at: "1:10", who: все, what: "5 мин: начать домашку, каждый повторяет файл, путь сдачи и срок 18.10 20:00 МСК. Финиш в 21:15."}
cutting_plan:
  input_gap:
    trigger: "20:12 — ещё нет работающего диалога"
    cut: "В Git сохранить текущий собственный файл; числовое расширение заменить завершением input."
  git_missing:
    trigger: "git не найден или исправление настройки длится более 60 секунд"
    cut: "Сохранить две копии собственного файла; показать смысл операций, личные коммиты не засчитывать; настройка отдельно."
  git_overrun:
    trigger: "20:37 — второй коммит ещё не готов"
    cut: "Зафиксировать достигнутое, оставить второй коммит на домашку; сохранить паузу. GitHub-показ убрать."
  github_access:
    trigger: "нет готового доступа"
    cut: "Работать локально; срок загрузки согласовать после доступа; не начинать регистрацию в общем эфире."
  late:
    trigger: "к 21:00 основные блоки не закончены"
    cut: "Убрать int, закончить личный минимум. Учебник без длинных отступлений."
  never_cut:
    - "Личный ввод и запуск Python; показ преподавателя его не заменяет."
    - "Git раньше расширений Python; факт коммитов фиксировать по экрану."
    - "20 минут учебника, пауза и 5 минут домашки."
    - "Завершение не позже 21:15; completed заполняется после занятия по факту."
