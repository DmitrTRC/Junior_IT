# Среда 30.09: домашка python-01 на экране каждого, починка broken.py,
# зачёт §1.1 в тренажёре, первые переменные. Факт к 30.09: python-01 руками
# прошли все трое (Неля — 24.09 и вебинар после 27.09, Маша — вебинар после
# 27.09, Матвей — один на один 28–29.09), домашку не прислал никто, тренажёр
# группа ещё не открывала. Уроки разбора 27.09: ротация — механический гейт
# (назвал имя — молчи, пока не появился экран), Димас не набирает вообще,
# логистика (Telegram/MAX/GitHub/чат Zoom) — только текстом до эфира.
date: 2026-09-30
time: "20:00"
duration: 75
theme: "Домашка на экране, зачёт §1.1, первые переменные"
playlist:
  - {module: book/m-01-information-and-data, minutes: 20}
  - {module: python/m-01-first-run, minutes: 40}
buffer: 15
# book-01 здесь — зачёт §1.1 в тренажёре (Тренировка 6 + разбор 3 + Зачёт 8 +
# итог 2); python-01 — домашка на экране (13), broken.py (12), переменные (13),
# старт и домашка голосом (4).
# Факт (разбор записи 01.10): в эфире Маша и, позже, Неля; Матвей отсутствовал
# (репетитор по математике). Весь урок — hello.py и broken.py руками у двоих,
# по очереди, без ротации; Димас не печатал сам. Тренажёр, зачёт §1.1 и шаг 6
# «переменные» не состоялись — отложены голосом. Домашку к 30.09 не сделал
# никто. Логистика (чат Zoom не доставлял, сайт с телефона через MAX не
# открывался, Backspace на нестандартной клавиатуре) съела буфер и половину
# плана. Ничего нового группе не засчитываем.
completed: []
# Домашка по факту: ещё раз hello.py + broken.py до воскресенья 04.10, голосом
# без файла и канала. python-01-variables переносится на занятие 04.10 —
# шаг 6 детям не показан, задавать его рано.
homework:
  due: 2026-10-04
  items:
    - homework/python-01-first-run

# До эфира (вторник вечером, только текстом — в эфире логистику не обсуждаем):
# - broken.py каждому ещё раз вложением в Telegram (дубль в MAX) + одна строка:
#   «сохрани в ~/code/junior_it/hw/01/, чинить не обязательно — разберём
#   вместе; кто починил сам — покажет первым».
# - ссылка на тренажёр https://dmitrtrc.github.io/Junior_IT/trainer/ —
#   «открой до занятия, впиши имя, дальше не нажимай». В тренажёре зачёт
#   теперь сдаётся по одному параграфу — в среду сдаём §1.1, 6 вопросов.
# - мини-инструкция «как написать в чат Zoom» (27.09 Матвей не нашёл):
#   кнопка «Чат» внизу окна Zoom → поле ввода → Enter.
# - Неля: системный 3.9.6 — текст ошибок чуть другой (EOL while scanning…),
#   см. «Если живой код встал» в live-code.md. Маша — Git Bash, python3 и nano
#   как на маке. Матвей — Windows: python без «3», редактор тот же, что был
#   на его занятии 28–29.09; таблица PowerShell в live-code.md — на случай.
# - Экран Димаса — только слайды и тренажёр. Терминал не открывать вовсе.

# Ротация — гейт: в момент `at` назвать имя и ждать экран ученика с набранной
# командой. За 60 секунд экрана нет — он наблюдатель этого раунда (набирает у
# себя, называет результат вслух), ход переходит следующему, к нему — в буфере.
rotation:
  - {at: "0:00", who: все, what: "старт-гейт: cd ~/code/junior_it/hw/01 и ls — по 30 сек на своём шаринге, Матвей первый; hello.py нет — не беда, напишешь через минуту"}
  - {at: "0:02", who: Маша, what: "python3 hello.py на своём шаринге; файла нет — три print прямо сейчас в nano — 4 мин"}
  - {at: "0:06", who: Матвей, what: "python hello.py (Windows: без «3») — 4 мин"}
  - {at: "0:10", who: Неля, what: "python3 hello.py; вопрос вслух ей: «чем файл отличается от >>>?» — 3 мин"}
  - {at: "0:13", who: Димас, what: "мостик 1 мин: в broken.py три ошибки, чиним по одной — каждый запуск подсказывает следующую; у кого файла нет — три строки набрать со слайда, 2 мин"}
  - {at: "0:15", who: Маша, what: "python3 broken.py: ошибка 1 — незакрытая кавычка в строке 2, читаем снизу вверх, чинит, запуск — 4 мин; остальные чинят у себя параллельно"}
  - {at: "0:19", who: Матвей, what: "ошибка 2 — Print с большой буквы: NameError и Did you mean: 'print'? — чинит, запуск — 3 мин"}
  - {at: "0:22", who: Неля, what: "ошибка 3 — лишняя скобка: SyntaxError unmatched ')' — чинит, финальный запуск без красного; все трое вслух: «чисто» — 3 мин"}
  - {at: "0:25", who: Димас, what: "ссылка на тренажёр в чат Zoom; «Что тренируем: §1.1», кнопка Тренировка; свой экран — только тренажёр — 1 мин"}
  - {at: "0:26", who: все, what: "Тренировка §1.1 — 8 вопросов, каждый у себя; закончил — «готов» в чат Zoom; Димас молчит — 6 мин"}
  - {at: "0:32", who: Димас, what: "спросить в чат «какой вопрос был трудным?», разобрать два — 3 мин, не больше"}
  - {at: "0:35", who: все, what: "Зачёт §1.1 — 6 вопросов, каждый у себя; скриншот экрана результата в чат Zoom — 8 мин"}
  - {at: "0:43", who: Димас, what: "итог каждому: что сдано, что добрать, без сравнения детей между собой; не сдал — пересдача дома в тренажёре до воскресенья — 2 мин"}
  - {at: "0:45", who: Димас, what: "шаг 6 live-code «переменная — коробка с именем»: голосом 2 мин, без набора"}
  - {at: "0:47", who: Матвей, what: "шаг 6 в >>>: name = \"Матвей\", print(name), age = 13, print(age + 1) — 4 мин; остальные набирают у себя"}
  - {at: "0:51", who: Маша, what: "шаг 6 в файле: hello.py — первая строка через переменную name и print(\"Меня зовут\", name), запуск — 4 мин"}
  - {at: "0:55", who: Неля, what: "эксперт (переменные делала 24.09): a = 20, b = 30, print(a + b); затем print(a + \"1\") — TypeError, читаем снизу вверх — 3 мин"}
  - {at: "0:58", who: Димас, what: "домашка ГОЛОСОМ: hello.py на переменных до воскресенья 04.10, скриншот в Telegram или MAX; анонс воскресенья — 2 мин"}
  - {at: "1:00", who: —, what: "буфер 15 мин: наблюдатели раундов — их python3 hello.py на своём шаринге"}

cutting_plan:
  rotation_gate:
    trigger: "имя названо, экран ученика не появился за 60 секунд"
    cut: "он наблюдатель этого раунда: набирает у себя, называет результат вслух; ход следующему по кругу; к нему — в буфере 1:00"
    note: "27.09 ротация не состоялась ни разу — экран держал Димас весь урок"
  teacher_typing:
    trigger: "у Димаса открыт терминал"
    cut: "закрыть; свой экран — слайды и тренажёр, любой ввод — руками ученика на его шаринге"
    note: "27.09 весь live-code прошёл на экране Димаса"
  recap_timebox:
    trigger: "мостик, вступление или байка идёт 3-ю минуту"
    cut: "одна фраза и имя следующего по ротации"
    note: "27.09 «Почему Python» разросся в историю Unix и антивирусов"
  logistics_out:
    trigger: "разговор про Telegram, MAX, GitHub или как пользоваться чатом Zoom"
    cut: "«напишу текстом после» — 10 секунд, и дальше по плану"
    note: "27.09 несколько минут ушло на Telegram vs MAX vs GitHub"
  no_live_tech_fix:
    trigger: "у кого-то не открывается терминал или python в первые 2 минуты"
    cut: "наблюдатель: набирает на слух, называет ответы; тренажёр у него в браузере работает всё равно; разбор после эфира"
  if_behind_10min:
    trigger: "к 0:35 зачёт не начат"
    cut:
      - "Тренировку — до 3 минут, разбор трудных вопросов — убрать"
      - "переменные — только у Матвея на шаринге, Маша и Неля параллельно у себя"
      - "домашка всё равно голосом, со сроком и каналом"
  never_cut:
    - "python3 hello.py на своём шаринге у каждого из троих"
    - "Зачёт §1.1 — каждый у себя, скриншот результата в чат"
    - "домашка голосом: что, до какого дня, куда прислать — минимум 30 секунд"
  last_resort: "жертвуй переменными целиком (шаг 6 — на воскресенье), не зачётом и не домашкой на экране"
