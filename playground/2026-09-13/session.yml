# Плейлист занятия. Модули и длительности — из module.yml трёх модулей,
# не переписывать вручную при расхождении: правда в манифесте.
date: 2026-09-13
time: "20:00"
duration: 75
theme: "Терминал и первый Python"
playlist:
  - {module: book/m-01-information-and-data, minutes: 15}
  - {module: devops/m-01-terminal-first-steps, minutes: 25}
  - {module: python/m-01-first-run, minutes: 25}
buffer: 10
homework:
  due: 2026-09-16
  items:
    - homework/book-01-information-sources
    - homework/devops-01-terminal
    - homework/python-01-first-run

# План отсечения. Буфер 10 мин — общий, а в занятии два «первых раза» подряд
# (первый терминал, следом первый Python), и python-01 логически требует,
# чтобы devops-01 прошёл по плану (requires в module.yml). Один общий буфер
# должен покрыть переработку сразу трёх блоков — реального запаса на это нет.
cutting_plan:
  hidden_slack: >
    Реальный хронометраж book-01 по прошлым занятиям — 8–11 минут против
    15 бюджетных: 4–6 минут запаса спрятаны внутри первого такта, не в
    общем буфере. Если book идёт по нижней границе — не давай этому запасу
    раствориться в паузе перед devops, сознательно веди группу дальше раньше.
  if_behind_5min:
    trigger: "суммарное отставание 5 минут к концу блока devops"
    cut: "devops-01, шаг 6 — проверка и установка Python (сегмент 19:00–25:00 в teacher/scenario.md) — пропустить целиком"
    already_planned: "сам сценарий devops-01 помечает этот шаг как «если останется время» и заранее предусматривает перенос"
    fallback: "python3 --version (и установка при нужде) — первым делом в начале python-01, до REPL, вместо шага 19:00–25:00 в devops"
    saves_minutes: 6
  if_behind_10min:
    trigger: "суммарное отставание 10 минут — после devops или замечено в начале python"
    cut:
      - "devops-01, шаг 3 — Windows-слайд (14:00–19:00): одна фраза вместо разбора слайда"
      - "python-01, такт «Почему Python» (0:00–3:00): сжать до одной минуты"
      - "python-01, такт «Что дальше» (23:00–25:00): не проговаривать — отправить текстом в MAX вместе со шпаргалкой"
    saves_minutes: 7
  never_cut:
    - "python-01, шаг 5 — намеренная ошибка и чтение traceback (18:00–23:00): кульминация занятия"
    - "devops-01, живой код шаги 1–5 (4:00–14:00), особенно чтение пути в шаге 1: ключевой момент модуля, на нём держится всё дальше"
  last_resort: "если не хватает и после всех отсечений — жертвуй вторым прогоном/диалогом вокруг traceback, не самим показом ошибки"
