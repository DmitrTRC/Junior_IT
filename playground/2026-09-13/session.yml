# План отсечения. Буфер 10 мин — общий, а в занятии два «первых раза» подряд
# (первый терминал, следом первый Python), и python-01 логически требует,
# чтобы devops-01 прошёл по плану (requires в module.yml). Один общий буфер
# должен покрыть переработку сразу трёх блоков — реального запаса на это нет.
cutting_plan:
  hidden_slack: >
    15 минут book-01 в манифесте — оценка по объёму текста сценария, не
    факт: модуль создан в этой же ветке под 13.09 и никогда не проводился.
    Отдельного скрытого запаса внутри блока нет — все пять тактов
    teacher/scenario.md укладываются в 15 минут впритык (0–3, 3–7, 7–11,
    11–15, плюс секунд тридцать внахлёст на «шпаргалка и домашка»). Если
    book реально идёт быстрее — это не подтверждённый резерв, на который
    можно рассчитывать, а повод просто вести группу дальше раньше.
  if_behind_5min:
    trigger: "суммарное отставание 5 минут к концу блока devops"
    cut: "devops-01, шаг 6 — проверка Python (сегмент 20:00–25:00 в teacher/scenario.md) — пропустить целиком"
    already_planned: "это обычный такт сценария, не помечен как опциональный — срез не запланирован заранее, а решается по факту отставания"
    fallback: "python3 --version — первым делом в начале python-01, до REPL, вместо среза в devops (установки не будет ни там, ни там — см. shared/live-code.md обоих модулей)"
    saves_minutes: 5
  if_behind_10min:
    trigger: "суммарное отставание 10 минут — после devops или замечено в начале python"
    cut:
      - "python-01, такт «Почему Python» (0:00–3:00): сжать до одной минуты"
      - "python-01, такт «Что дальше» (23:00–25:00): не проговаривать — отправить текстом в MAX вместе со шпаргалкой"
    excluded_note: >
      Windows-слайд devops-01 (17:00–20:00) в этот план больше не входит:
      сценарий уже урезал его до одной фразы на 3 минуты, дальше резать
      нечего.
    saves_minutes: 4
  never_cut:
    - "python-01, шаг 5 — намеренная ошибка и чтение traceback (18:00–23:00): кульминация занятия"
    - "devops-01, живой код шаги 1–5 (4:00–17:00), особенно чтение пути в шаге 1: ключевой момент модуля, на нём держится всё дальше"
  last_resort: "если не хватает и после всех отсечений — жертвуй вторым прогоном/диалогом вокруг traceback, не самим показом ошибки"
