  who: все
  what: 'Восстановить цепочку старта и число 42, объяснить связь, сохранить наблюдения.'
goals:
- 'Узнать не менее пяти ролей компонентов IBM 5160 и найти их соответствия на 286-плате'
- 'Восстановить путь от питания до ОС, поместив POST внутрь работы BIOS'
- 'Составить 42 из двоичных разрядов и связать записи в основаниях 2, 8, 10 и 16'
- 'Отличить назначение системы, ISA, организацию памяти и роль ОС'
- 'Связать ресурсы компьютера с реальной задачей, а не только с числом в характеристиках'
- 'Сохранить собственные объяснения и наблюдения в lab-notes.txt или на листе'
