  items:
    - homework/python-01-first-run

# Ротация шаринга: трое, 75 минут. Правило — шарит один, набирают все трое
# у себя; двое без шаринга называют результат вслух («что у тебя после 10 / 3?»).
# Маша — Windows/PowerShell (python, ni, notepad — вставка в live-code.md);
# Неля и Матвей — мак.
rotation:
  - {at: "0:00", who: все, what: "техчек: терминал открыт, pwd — по 1 мин каждому, Маша первая"}
  - {at: "0:03", who: Маша, what: "devops-01 шаги 1–5 руками: pwd, ls, cd ~, cd ~/code/junior_it, ni notes.md, explorer ."}
  - {at: "0:11", who: Матвей, what: "devops-01 сжато: cd ~/code/junior_it, ls, touch, open . — 2 мин"}
  - {at: "0:13", who: Неля, what: "то же, 2 мин; все трое стоят в рабочей папке"}
  - {at: "0:15", who: Димас, what: "python-01 S1–S2 «Почему Python» — 3 мин, свой шаринг"}
  - {at: "0:18", who: Маша, what: "шаги 1–3: python, 2 + 2, 10 / 3, 10 // 3, print, exit() — 4 мин"}
  - {at: "0:22", who: Матвей, what: "шаги 1–3 без 10 // 3 — 2.5 мин"}
  - {at: "0:25", who: Неля, what: "шаги 1–3 без 10 // 3 — 2.5 мин"}
  - {at: "0:27", who: Матвей, what: "шаг 4: touch, nano, три print о себе, python3 hello.py — 7 мин; остальные набирают свой hello.py параллельно"}
  - {at: "0:34", who: Маша, what: "python hello.py на своём шаринге — 1 мин (файл набран в notepad параллельно)"}
  - {at: "0:35", who: Неля, what: "python3 hello.py — 1 мин; Димас S4 «разговор против письма» — 1 мин"}
  - {at: "0:37", who: Неля, what: "шаг 5: стереть кавычку, запуск, читаем снизу вверх; Димас S5 — 6 мин"}
  - {at: "0:43", who: Маша, what: "ломает свой hello.py, читает последнюю строку traceback вслух — 2 мин (первое, что режем)"}
  - {at: "0:45", who: Матвей, what: "то же — 2 мин (режем вторым)"}
  - {at: "0:47", who: Димас, what: "S6 «Что дальше» + домашка вслух: hello.py + broken.py, до среды 23.09, скриншотами в MAX — 3 мин"}
  - {at: "0:50", who: Димас, what: "тренажёр главы 1, режим Тренировка: по одному вопросу каждому вслух; зачёт 30.09 — 15 мин"}
  - {at: "1:05", who: —, what: "буфер 10 мин"}

cutting_plan:
  tech_check:
    trigger: "первые 3 минуты — у каждого открывается терминал"
    cut: "у кого не открылся — работает наблюдателем, разбор после занятия; эфир дальше"
    note: "никакой отладки техники в эфире — урок 16.09"
  no_os_lecture:
    trigger: "потянуло рассказывать про Linux/POSIX/доли рынка"
    cut: "одна фраза-мостик и руки на клавиатуру"
  midpoint_check:
    trigger: "к 20-й минуте python-01 не начат"
    cut: "закрепление devops обрезать немедленно, cd в рабочую папку — и в python"
  if_behind_10min:
    trigger: "отставание 10 минут внутри python-01"
    cut:
      - "такт «Почему Python» — до одной минуты"
      - "такт «Что дальше» — текстом в MAX со шпаргалкой"
      - "тренажёр-закрепление — переносится на воскресенье"
  no_expert_fallback:
    trigger: "Неля отсутствует"
    cut: "роль эксперта никому не передаётся — Димас ведёт по шпаргалке соло, темп ниже"
  never_cut:
    - "python-01 шаг 5 — намеренная ошибка и чтение traceback: кульминация, руками ребёнка"
    - "каждый из троих набирает python3 и первый print сам, на своём шаринге"
  last_resort: "жертвуй тренажёром и вторым прогоном traceback, не первым print каждого ребёнка"
