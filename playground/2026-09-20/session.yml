date: 2026-09-20
time: "20:00"
duration: 75
theme: "Первый Python — руками каждого"
playlist:
  - {module: devops/m-01-terminal-first-steps, minutes: 15}
  - {module: python/m-01-first-run, minutes: 35}
buffer: 10
# devops-01 — закрепление руками: 16.09 Маша ни одной команды не набрала
# сама (терминал показывал Димас). Ротация шаринга: Маша первая.
# Остаток (~15 мин) — тренажёр главы 1 всей группой (Тренировка, §1.1):
# показать инструмент и напомнить про зачёт 30.09.
# Факт 20.09 (анализ записи): вступление-повтор и техчек съели эфир,
